server:
  port: 8080

spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service
              uri: ${AUTH_URI:http://localhost:8083}
              predicates:
                - Path=/api/v1/auth/**

            - id: transaction-service
              uri: ${TRANSACTION_SERVICE_URI:http://localhost:8081}
              predicates:
                - Path=/api/v1/transactions/**,/api/v1/transactions

security:
  jwt:
    secret: ${JWT_SECRET}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    operations-sorter: method
    tags-sorter: alpha

logging:
  level:
    com.zverev.gateway: DEBUG

management:
  server:
    port: 8091
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    prometheus:
      enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
    tags:
      application: ${spring.application.name}