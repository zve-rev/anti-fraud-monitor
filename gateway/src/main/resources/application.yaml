server:
  port: 8080

spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service
              uri: ${AUTH_URI:http://localhost:8083}
              predicates:
                - Path=/api/v1/auth/**
            - id: ingestion-create
              uri: ${INGESTION_URI:http://localhost:8081}
              predicates:
                - Path=/api/v1/transactions
                - Method=POST
            - id: alerting-transactions
              uri: ${ALERTING_URI:http://localhost:8082}
              predicates:
                - Path=/api/v1/transactions, /api/v1/transactions/{id}
                - Method=GET
            - id: alerting-alerts
              uri: ${ALERTING_URI:http://localhost:8082}
              predicates:
                - Path=/api/v1/alerts
                - Method=GET

security:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-at-least-32-bytes!!}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    operations-sorter: method
    tags-sorter: alpha

logging:
  level:
    com.zverev.gateway: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway,metrics,prometheus
  endpoint:
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}