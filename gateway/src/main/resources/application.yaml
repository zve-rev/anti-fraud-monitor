server:
  port: 8080

spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: ingestion-create
              uri: ${INGESTION_URI:http://localhost:8081}
              predicates:
                - Path=/api/v1/transactions
                - Method=POST

            - id: alerting-transactions
              uri: ${ALERTING_URI:http://localhost:8082}
              predicates:
                - Path=/api/v1/transactions
                - Method=GET

            - id: alerting-alerts
              uri: ${ALERTING_URI:http://localhost:8082}
              predicates:
                - Path=/api/v1/alerts
                - Method=GET

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway