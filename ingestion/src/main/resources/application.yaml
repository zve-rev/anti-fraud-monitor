server:
  port: 8081

spring:
  application:
    name: ingestion-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/antifraud}
    username: ${SPRING_DATASOURCE_USERNAME:antifraud}
    password: ${SPRING_DATASOURCE_PASSWORD:antifraud}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    operations-sorter: method
    tags-sorter: alpha