server:
  port: 8083

spring:
  application:
    name: auth
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/antifraud}
    username: ${SPRING_DATASOURCE_USERNAME:antifraud}
    password: ${SPRING_DATASOURCE_PASSWORD:antifraud}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

security:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-at-least-32-bytes!!}
    expiration-ms: 86400000

management:
  endpoints:
    web:
      exposure:
        include: health,info