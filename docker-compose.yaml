services:
  postgres:
    image: postgres:16
    container_name: antifraud-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-antifraud}
      POSTGRES_USER: ${POSTGRES_USER:-antifraud}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-antifraud}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-antifraud}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: antifraud-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:3.7.0
    container_name: antifraud-kafka
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    container_name: antifraud-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "${KAFKA_UI_PORT:-8090}:8080"
    environment:
      - KAFKA_CLUSTERS_0_NAME=local-kafka
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:29092

  ingestion:
    build:
      context: .
      dockerfile: ingestion/Dockerfile
    container_name: antifraud-ingestion
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "${INGESTION_PORT:-8081}:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-antifraud}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-antifraud}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-antifraud}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092

  scoring:
    build:
      context: .
      dockerfile: scoring/Dockerfile
    container_name: antifraud-scoring
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-antifraud}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-antifraud}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-antifraud}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379

  alerting:
    build:
      context: .
      dockerfile: alerting/Dockerfile
    container_name: antifraud-alerting
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${ALERTING_PORT:-8082}:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-antifraud}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-antifraud}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-antifraud}

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    container_name: antifraud-gateway
    depends_on:
      ingestion:
        condition: service_started
      alerting:
        condition: service_started
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    environment:
      INGESTION_URI: http://ingestion:8081
      ALERTING_URI: http://alerting:8082

  prometheus:
    image: prom/prometheus:latest
    container_name: antifraud-prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    container_name: antifraud-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-data:/var/lib/grafana
  k6:
    image: grafana/k6:latest
    container_name: antifraud-k6
    profiles: [ "loadtest" ]
    volumes:
      - ./k6:/scripts
    command: run /scripts/load-test.js --summary-export=/scripts/summary.json
    depends_on:
      - gateway

volumes:
  pgdata:
  redisdata:
  kafkadata:
  grafana-data: