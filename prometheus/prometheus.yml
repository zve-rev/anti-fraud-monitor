global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'ingestion'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['ingestion:8081']

  - job_name: 'alerting'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['alerting:8082']

  - job_name: 'auth'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['auth:8083']

  - job_name: 'gateway'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['gateway:8091']

  - job_name: 'scoring'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: [ 'scoring:8084' ]